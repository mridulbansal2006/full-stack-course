<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="cal.css">
</head>

<body>
    <div id="outerbox">
        <div id="showoutput">
            <button id="result">
            </button>
        </div>
        <div id="numberofboxes">
            <button id="nine" class="boxstyling number">9</button>
            <button id="eight" class="boxstyling number">8</button>
            <button id="seven" class="boxstyling number">7</button>
            <button id="division" class="boxstyling">/</button>
            <button id="six" class="boxstyling number">6</button>
            <button id="five" class="boxstyling number">5</button>
            <button id="four" class="boxstyling number">4</button>
            <button id="multiply" class="boxstyling">*</button>
            <button id="three" class="boxstyling number">3</button>
            <button id="two" class="boxstyling number">2</button>
            <button id="one" class="boxstyling number">1</button>
            <button id="minus" class="boxstyling number">-</button>
            <button id="zero" class="boxstyling number">0</button>
            <button id="dot" class="boxstyling">.</button>
            <button id="equalsto" class="boxstyling">=</button>
            <button id="plus" class="boxstyling">+</button>
            <button id="clear" class="boxstyling">C</button>
            <button id="delete" class="boxstyling">cross</button>
        </div>

    </div>
    <script src="cal.js"></script>
</body>

</html>
