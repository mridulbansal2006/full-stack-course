<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
        
        .mridul{padding-left: 20px;}


      </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <br><br>
    <h2><strong>Registration Form</strong></h2><br>
    
    <form action="">
        <fieldset class="mridul">
            <legend>User personal information</legend><br>
            <label for="name" class="mridul">Enter your full name</label><br>
            <input type="text" id="name" required class="mridul">
            <br><br>
            <label for="email" class="mridul">Enter your email</label><br>
            <input type="email"  id="email" class="mridul"><br><br>
            <label for="password" class="mridul">enter your password</label><br>
            <input type="password" id="password" class="mridul"><br><br>
            <label for="password" class="mridul">confirm your password</label><br>
            <input type="password" id="password" class="mridul"><br><br>
            <label for="gender" class="mridul">Enter your gender:</label><br><br>
            <input type="radio" id="gender" name="tr" class="mridul">Male
            <br>
            <input type="radio" id="gender" class="mridul" name="tr">Female
            <br>
            <input type="radio" id="gender" class="mridul" name="tr">Others<br><br>
            <label for="placeholder" class="mridul">Enter your address</label><br>
            <textarea name="" id="placeholder" class="mridul"></textarea><br><br>
            <button class="mridul">signup</button>

        </fieldset>
    </form>
</body>
</html>
