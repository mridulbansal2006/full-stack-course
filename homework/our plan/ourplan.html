<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0%;
        }
    </style>
    <link rel="stylesheet" href="ourplan.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body id="body">
    <header>
        <h1 id="ourplan">Our plan</h1>
    </header>
    <main id="display">
        <section id="freebox">
            <div class="textboxstyling">
                <div class="headertextgap">
                    <h1 class="boxheaderstyling">free</h1>
                </div>
                <div>
                    <p class="textstyling"><span class="dollarstyling">$0</span>/mo</p>
                </div>
                <div>
                    <p class="firsttextstyling"><span>✅</span>basic features</p>
                </div>
                <div>
                    <p class="firsttextstyling"><span>✅</span>Community Support</p>
                </div>
                <div>
                    <p class="firsttextstyling"><span>❌</span>no customization</p>
                </div>
                <div>
                    <button class="buttonstyling">select</button>
                </div>
            </div>
        </section>

        <section id="probox">
            <div id="recommendedposition">
                <button id="recommendedstyle">recommended</button>
            </div>
            <div class="textboxstyling">
                <div class="headertextgap">
                    <h1 class="boxheaderstyling">Pro</h1>
                </div>
                <div>
                    <p class="textstyling"><span class="dollarstyling">$12</span>/mo</p>
                </div>
                <div>
                    <p class="firsttextstyling"><span>✅</span>ALL Free Featues</p>
                </div>
                <div>
                    <p class="firsttextstyling"><span>✅</span>Email Support</p>
                </div>
                <div>
                    <p class="firsttextstyling"><span>❌</span>customization</p>
                </div>
                <div>
                    <button class="buttonstyling">select</button>
                </div>
            </div>
        </section>


        <section id="premiumbox">
            <div class="textboxstyling">
                <div class="headertextgap">
                    <h1 class="boxheaderstyling">Premium</h1>
                </div>
                <div>
                    <p class="textstyling"><span class="dollarstyling">$29</span>/mo</p>
                </div>
                <div>
                    <p class="firsttextstyling"><span>✅</span>everthing in pro</p>
                </div>
                <div>
                    <p class="firsttextstyling"><span>✅</span>priority Support</p>
                </div>
                <div>
                    <p class="firsttextstyling"><span>❌</span>Dedicated account</p>
                </div>
                <div>
                    <button class="buttonstyling">select</button>
                </div>
            </div>
        </section>
    </main>

</body>

</html>
